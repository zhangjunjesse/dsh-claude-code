# Bundle wiring for dsh plugin add / registry installs.
# NOTE: proxy below is a machine-specific default for this dev machine (outbound is a datacenter IP,
# Anthropic rejects direct requests with 403). Publishing later should drop or comment the proxy line.
# timeoutMs = hard abort (2h); warnTimeoutMs/warnIntervalMs = periodic warnings in the panel (defaults 1h/30m).
# permissionMode bypassPermissions + allowDangerouslySkipPermissions = run everything without prompts
# (trusted machine; publishing later should revert to acceptEdits).
- insert:
    - id: claude-code
      name: dsh-claude-code
      config:
        model: sonnet
        permissionMode: bypassPermissions
        allowDangerouslySkipPermissions: true
        maxTurns: 100
        timeoutMs: 7200000
        proxy: http://127.0.0.1:7897
